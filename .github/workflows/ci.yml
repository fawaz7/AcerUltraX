name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (loader test DLL) , PipeWire and GTK headers
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm libpipewire-0.3-dev libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests that need the DTS engine or the reference recordings skip themselves here; see docs/TESTING.md.
      - run: cargo test --workspace
