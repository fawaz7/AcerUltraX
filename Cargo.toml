[workspace]
resolver = "3"
members = ["crates/pe-loader", "crates/dts-eagle", "crates/importer", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Fawaz Al-Ghzawi <ghazawe1@gmail.com>"]
repository = "https://github.com/fawaz7/AcerUltraX"

[workspace.dependencies]
pe-loader = { path = "crates/pe-loader" }
dts-eagle = { path = "crates/dts-eagle" }
importer = { path = "crates/importer" }
libc = "0.2"
thiserror = "2"
anyhow = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
hound = "3"

[profile.release]
panic = "abort"
lto = "thin"

[profile.dev]
panic = "abort"
